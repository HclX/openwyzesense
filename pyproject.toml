[project]
name = "openwyzesense-reference"
version = "0.1.0"
description = "Reference implementation and checks for the Wyze Sense RF protocol"
requires-python = ">=3.10"
dependencies = ["pycryptodome>=3.20", "numpy>=1.26"]

[dependency-groups]
dev = [
    "clang-format>=23.1.3",
    "clang-tidy>=23.1.3",
    "pytest>=8",
    "ruff>=0.17.2",
    "shellcheck-py>=0.11.0.1",
    "shfmt-py>=4.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["reference"]
testpaths = ["reference/tests"]

[tool.ruff]
# Python style (issue #52; checked by tools/lint.sh)
line-length = 120
target-version = "py310"
extend-exclude = ["third_party", ".toolchain", "build", "ground_truth"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# E/W pycodestyle (E701/E702: one statement per line), F pyflakes, B bugbear, I imports, UP pyupgrade, SIM simplify
select = ["E", "W", "F", "B", "I", "UP", "SIM"]
